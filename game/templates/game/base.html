<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Death by AI
      {% endblock %}
    </title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'orbitron': ['Orbitron', 'monospace'],
              'roboto': ['Roboto', 'sans-serif']
            },
            colors: {
              'danger': '#dc3545',
              'danger-light': '#ff6b7a',
              'danger-dark': '#c82333',
              'warning': '#ffc107',
              'success': '#28a745',
              'dark-bg': '#0a0a0a',
              'dark-primary': '#1a1a2e',
              'dark-secondary': '#16213e',
              'dark-tertiary': '#0f0f23'
            },
            animation: {
              'gradient-shift': 'gradientShift 3s ease-in-out infinite',
              'pulse-custom': 'pulseCustom 2s ease-in-out infinite',
              'float': 'float 20s ease-in-out infinite',
              'spin-slow': 'spin 1.5s linear infinite',
              'blink': 'blink 1.8s infinite both',
              'glitch': 'glitch 0.3s ease-in-out infinite alternate',
              'fade-in-out': 'fadeInOut 2s ease-in-out infinite'
            },
            keyframes: {
              gradientShift: {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' }
              },
              pulseCustom: {
                '0%, 100%': { opacity: '0.8' },
                '50%': { opacity: '1' }
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                '33%': { transform: 'translateY(-20px) rotate(1deg)' },
                '66%': { transform: 'translateY(20px) rotate(-1deg)' }
              },
              blink: {
                '0%, 80%, 100%': { opacity: '0.2', transform: 'scale(1)' },
                '40%': { opacity: '1', transform: 'scale(1.3)' }
              },
              glitch: {
                '0%': { transform: 'translate(0)' },
                '20%': { transform: 'translate(-2px, 2px)' },
                '40%': { transform: 'translate(-2px, -2px)' },
                '60%': { transform: 'translate(2px, 2px)' },
                '80%': { transform: 'translate(2px, -2px)' },
                '100%': { transform: 'translate(0)' }
              },
              fadeInOut: {
                '0%, 100%': { opacity: '0.7' },
                '50%': { opacity: '1' }
              }
            }
          }
        }
      }
    </script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500;700&display=swap');
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 75%, #000000 100%);
        background-attachment: fixed;
        color: white;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }
      
      /* Animated background particles */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 80%, rgba(220, 53, 69, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255, 193, 7, 0.08) 0%, transparent 50%), radial-gradient(circle at 40% 40%, rgba(40, 167, 69, 0.05) 0%, transparent 50%);
        animation: float 20s ease-in-out infinite;
        pointer-events: none;
        z-index: -1;
      }
      
      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        33% {
          transform: translateY(-20px) rotate(1deg);
        }
        66% {
          transform: translateY(20px) rotate(-1deg);
        }
      }
      
      .container {
        max-width: 900px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }
      
      /* Header styles */
      .game-header {
        text-align: center;
        padding: 30px 0;
        position: relative;
      }
      
      .title {
        font-family: 'Orbitron', monospace;
        font-size: clamp(32px, 8vw, 64px);
        font-weight: 900;
        margin-bottom: 15px;
        background: linear-gradient(45deg, #dc3545, #ff6b7a, #ff4757, #dc3545);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 3s ease-in-out infinite;
        text-shadow: 0 0 30px rgba(220, 53, 69, 0.5);
        letter-spacing: 3px;
      }

      .result_title {
        font-family: 'Orbitron', monospace;
        font-size: clamp(32px, 8vw, 64px);
        font-weight: 900;
        background: linear-gradient(45deg, #dc3545, #ff6b7a, #ff4757, #dc3545);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientShift 3s ease-in-out infinite;
        text-shadow: 0 0 30px rgba(220, 53, 69, 0.5);
        letter-spacing: 3px;
      }
      
      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      
      .subtitle {
        font-size: clamp(16px, 4vw, 24px);
        color: #ffc107;
        margin-bottom: 20px;
        font-weight: 300;
        letter-spacing: 1px;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.8;
        }
        50% {
          opacity: 1;
        }
      }
      
      /* Main content card */
      .content-card {
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        border: 1px solid rgba(220, 53, 69, 0.3);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }
      
      .content-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        transition: left 0.5s;
      }
      
      .content-card:hover::before {
        left: 100%;
      }
      
      /* Content styles */
      .content {
        position: relative;
        z-index: 2;
      }
      
      .description {
        font-size: 18px;
        line-height: 1.8;
        color: #e0e0e0;
        margin-bottom: 30px;
        text-align: left;
      }
      
      .description p {
        margin-bottom: 15px;
      }
      
      .description strong {
        color: #ffc107;
        font-weight: 600;
      }
      
      /* Scenario box */
      .scenario-box {
        background: linear-gradient(135deg, rgba(220, 53, 69, 0.1), rgba(255, 69, 0, 0.1));
        padding: 30px;
        margin: 30px 0;
        border-left: 5px solid #dc3545;
        border-radius: 15px;
        position: relative;
        overflow: hidden;
      }
      
      .scenario-box::before {
        content: '⚠️';
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 24px;
        opacity: 0.3;
      }
      
      .scenario-title {
        color: #dc3545;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 20px;
        font-family: 'Orbitron', monospace;
      }
      
      /* Forms */
      .form-group {
        margin: 30px 0;
      }
      
      .form-label {
        display: block;
        font-weight: 600;
        margin-bottom: 15px;
        font-size: 20px;
        color: #ffc107;
        font-family: 'Orbitron', monospace;
      }
      
      .form-textarea {
        width: 100%;
        padding: 20px;
        font-size: 16px;
        line-height: 1.5;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        color: white;
        resize: vertical;
        min-height: 120px;
        font-family: 'Roboto', sans-serif;
        transition: all 0.3s ease;
      }
      
      .form-textarea:focus {
        border-color: #dc3545;
        outline: none;
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.2);
      }
      
      .form-textarea::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      
      /* Buttons */
      .btn {
        display: inline-block;
        padding: 18px 36px;
        font-size: 18px;
        font-weight: 600;
        text-decoration: none;
        text-align: center;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 10px;
        font-family: 'Orbitron', monospace;
        position: relative;
        overflow: hidden;
      }
      
      .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
      }
      
      .btn:hover::before {
        left: 100%;
      }
      
      .btn-primary {
        background: linear-gradient(135deg, #dc3545, #ff4757);
        color: white;
        box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4);
      }
      
      .btn-primary:hover {
        background: linear-gradient(135deg, #c82333, #e63946);
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(220, 53, 69, 0.6);
      }
      
      .btn-secondary {
        background: linear-gradient(135deg, #6c757d, #858585);
        color: white;
        box-shadow: 0 8px 25px rgba(108, 117, 125, 0.4);
      }
      
      .btn-secondary:hover {
        background: linear-gradient(135deg, #5a6268, #737373);
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(108, 117, 125, 0.6);
      }
      
      .btn-success {
        background: linear-gradient(135deg, #28a745, #34ce57);
        color: white;
        box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);
      }
      
      .btn-success:hover {
        background: linear-gradient(135deg, #218838, #2ec946);
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(40, 167, 69, 0.6);
      }
      
      /* Result boxes */
      .result-box {
        padding: 30px;
        border-radius: 15px;
        font-size: 18px;
        position: relative;
        overflow: hidden;
      }
      
      .result-box::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 0px;
        background: currentColor;
      }
      
      .result-survived {
        background: linear-gradient(135deg, rgba(40, 167, 69, 0.2), rgba(52, 206, 87, 0.1));
        border: 1px solid rgba(40, 167, 69, 0.3);
        color: #d4edda;
      }
      
      .result-died {
        background: linear-gradient(135deg, rgba(220, 53, 69, 0.2), rgba(255, 71, 87, 0.1));
        border: 1px solid rgba(220, 53, 69, 0.3);
        color: #f8d7da;
      }
      
      /* Navigation */
      .nav-links {
        text-align: center;
        /* margin-top: 40px; */
        /* padding: 20px 0; */
      }
      
      .nav-link {
        color: #adb5bd;
        text-decoration: none;
        font-size: 16px;
        transition: all 0.3s ease;
        padding: 10px 20px;
        border-radius: 25px;
      }
      
      .nav-link:hover {
        color: white;
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }
      
      /* Responsive design */
      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }
      
        .content-card {
          padding: 25px;
          margin: 10px 0;
        }
      
        .btn {
          width: 100%;
          margin: 10px 0;
        }
      
        .title {
          font-size: 36px;
        }
      }
      
      /* Custom animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .animate-in {
        animation: fadeInUp 0.6s ease-out;
      }
      
      /* Custom blocks */
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="game-header animate-in">
        {% block subtitle %}
        {% endblock %}
      </header>

      <!-- Main content -->
      <div class="content-card animate-in">
        <main class="content">
          {% block content %}
            <div class="description">
              <p>Contenu par défaut - Ce bloc doit être remplacé dans les templates enfants</p>
            </div>
          {% endblock %}
        </main>
      </div>

      <!-- Navigation -->
      <nav class="nav-links">
        {% block navigation %}

        {% endblock %}
      </nav>
    </div>

    <!-- Scripts -->
    <script>
      // Animation on scroll
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('animate-in')
          }
        })
      })
      
      document.querySelectorAll('.content-card, .game-header').forEach((el) => {
        observer.observe(el)
      })
      
      // Add some interactive effects
      document.addEventListener('mousemove', (e) => {
        const cursor = { x: e.clientX, y: e.clientY }
        const title = document.querySelector('.title')
        if (title) {
          const rect = title.getBoundingClientRect()
          const titleCenter = {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2
          }
          const distance = Math.sqrt(Math.pow(cursor.x - titleCenter.x, 2) + Math.pow(cursor.y - titleCenter.y, 2))
          const maxDistance = 300
          const intensity = Math.max(0, (maxDistance - distance) / maxDistance)
          title.style.textShadow = `0 0 ${30 + intensity * 20}px rgba(220, 53, 69, ${0.5 + intensity * 0.5})`
        }
      })
    </script>

    {% block scripts %}
    {% endblock %}
  </body>
</html>
