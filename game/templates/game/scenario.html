{% extends 'game/base.html' %}

{% block title %}
  Death by AI - Scenario
{% endblock %}

{% block subtitle %}
  <div class="subtitle">⚡ Votre défi de survie personnalisé</div>
{% endblock %}

{% block content %}
  <div class="scenario-box animate-in">
    <div class="scenario-title">🔥 SITUATION MORTELLE :</div>
    <p style="font-size: 19px; font-weight: bold; line-height: 1.5; margin: 20px 0;">{{ scenario }}</p>
  </div>

  <form method="post" action="{% url 'game:scenario' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="player_action" class="form-label">💭 Comment survivez-vous ?</label>
      <textarea name="player_action" id="player_action" class="form-textarea" rows="5" placeholder="Décrivez votre stratégie de survie en détail... Soyez créatif, l'IA va juger votre ingéniosité !" required></textarea>
    </div>

    <div style="text-align: center; margin: 30px 0;">
      <button type="submit" class="btn btn-success">🎯 Tenter ma chance !</button>
    </div>
  </form>
{% endblock %}
